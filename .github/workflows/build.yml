name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build TattleTail.sln -c Release

      - name: Test
        run: dotnet test TattleTail.sln -c Release --no-build

      - name: Publish
        run: >
          dotnet publish src/TattleTail.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TattleTail-win-x64
          path: publish/TattleTail.exe

      # Launch the real app on the Windows runner, hidden in the tray as at sign-in, make some web
      # requests while it watches, and check it saw connections, traffic, website names and history.
      - name: Smoke test
        run: |
          $report = Join-Path $PWD 'smoke.json'
          $app = Start-Process publish/TattleTail.exe -ArgumentList '--smoke-test', "`"$report`"", '35', '--background' -PassThru
          Start-Sleep -Seconds 6

          # A second copy must hand over to the first and exit, not steal its event feeds.
          # It also asks the first copy, which started hidden, to show its window.
          # The web requests below come after this, so the report also proves the first copy kept counting.
          $second = Start-Process publish/TattleTail.exe -PassThru
          if (-not $second.WaitForExit(20000)) { $second.Kill(); throw 'A second TattleTail did not exit while the first was running' }
          Write-Host "Second copy exited by itself (exit code $($second.ExitCode))"
          if ($app.HasExited) { throw 'The first TattleTail exited when a second copy started' }

          foreach ($url in 'https://github.com', 'https://api.github.com', 'https://www.microsoft.com', 'https://www.wikipedia.org', 'https://api.nuget.org/v3/index.json') {
            try { Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 15 | Out-Null } catch { Write-Host "request to $url failed: $_" }
          }
          # curl exits within a second, usually before TattleTail could look it up by process id.
          # It must still be listed by name (learned from the kernel's process-start event).
          foreach ($url in 'https://github.com', 'https://www.microsoft.com', 'https://www.wikipedia.org') {
            & "$env:SystemRoot\System32\curl.exe" -s -o NUL --max-time 15 $url
            Write-Host "curl $url exited with code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
          if (-not $app.WaitForExit(150000)) { $app.Kill(); throw 'TattleTail did not finish the smoke test in time' }
          if (-not (Test-Path $report)) { throw "No smoke test report (exit code $($app.ExitCode))" }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Smoke test failed: see report above' }
          if ($result.totalBytes -le 0) { throw 'No traffic was measured' }
          if ($result.servers -le 0) { throw 'No servers were recorded in history' }
          if (-not $result.hiddenAtStart) { throw 'A --background start showed the window' }
          if (-not $result.windowVisible) { throw 'Starting a second copy did not bring back the hidden window' }
          if (-not $result.trayIconVisible) { throw 'No tray icon' }
          if ($result.autoStart -ne 'ok') { throw "Start with Windows: $($result.autoStart)" }
          if ($result.historyText -like 'Could not*') { throw "History panel: $($result.historyText)" }
          if ($result.historyStatus) { throw "History problem: $($result.historyStatus)" }
          if ($result.exitedProgramNames -notcontains 'curl') { throw 'The short-lived curl runs were not listed by name as exited programs' }
          if ($result.namedConnections -le 0) { Write-Warning 'No connections had website names' }

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: smoke.json
          if-no-files-found: ignore
