name: Release

# Publishing a GitHub release with a tag like "v26-11.R2.0" (or pushing such a tag)
# builds the app and attaches both downloads to the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test TattleTail.sln -c Release

      # Tags look like v26-11.R2.0: two-digit year, month, release number, patch.
      # Windows needs the file version as four plain numbers, so v26-11.R2.0 becomes 26.11.2.0;
      # the tag itself (without the "v") is kept as the product version people see.
      # Plain numeric tags such as v1.2.3 also work.
      - name: Work out version from tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d{2})-(\d{1,2})\.R(\d+)(?:\.(\d+))?$') {
            $patch = if ($Matches[4]) { $Matches[4] } else { '0' }
            $numeric = "$([int]$Matches[1]).$([int]$Matches[2]).$([int]$Matches[3]).$([int]$patch)"
          } elseif ($tag -match '^v?(\d+(\.\d+){1,3})$') {
            $numeric = $Matches[1]
          } else {
            throw "Tag '$tag' isn't in the expected form vYY-MM.R<release>.<patch> (e.g. v26-11.R2.0)"
          }
          $display = $tag.TrimStart('v')
          Write-Host "File version: $numeric   Product version: $display"
          "VERSION_NUMERIC=$numeric" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_DISPLAY=$display" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish standalone exe (no .NET install needed)
        run: >
          dotnet publish src/TattleTail.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION_NUMERIC }} -p:InformationalVersion=${{ env.VERSION_DISPLAY }}
          -p:IncludeSourceRevisionInInformationalVersion=false -o out/standalone

      - name: Publish small build (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/TattleTail.App -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION_NUMERIC }} -p:InformationalVersion=${{ env.VERSION_DISPLAY }}
          -p:IncludeSourceRevisionInInformationalVersion=false -o out/framework

      - name: Package
        run: |
          Copy-Item out/standalone/TattleTail.exe "TattleTail-${{ github.ref_name }}-win-x64.exe"
          Compress-Archive -Path out/framework/* -DestinationPath "TattleTail-${{ github.ref_name }}-win-x64-requires-dotnet.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TattleTail-${{ github.ref_name }}-win-x64.exe
            TattleTail-${{ github.ref_name }}-win-x64-requires-dotnet.zip
